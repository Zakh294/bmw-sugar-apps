# Monthly: rebuilds the camera packs (Ukraine from the Patrol Police, Europe and the USA from OpenStreetMap) and
# commits them to apps/speedcam_ua/packs/. The app in the car downloads the packs that changed, once a month
# (apps/speedcam_ua/updater.js), so no new app version is needed for new cameras.
# Free for a public repository; a few minutes a month of the free allowance for a private one.
name: camera packs

on:
  schedule:
    - cron: '17 3 2 * *'          # the 2nd of every month, 03:17 UTC
  workflow_dispatch: {}
  push:
    branches: ['actions/packs']   # push to this branch to build the packs there (testing the workflow)

permissions:
  contents: write

concurrency:
  group: camera-packs
  cancel-in-progress: false

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ukraine (the police list; kept as it is when the site does not answer)
        continue-on-error: true
        run: python3 tools/speedcam_ua/import_cameras.py --fetch && python3 tools/speedcam_ua/gen_app_data.py
      - name: Packs
        run: python3 tools/speedcam_ua/build_packs.py
      - name: Tests
        run: python3 test/speedcam_ua/packs_test.py
      - name: Commit
        run: |
          git config user.name "camera-packs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/speedcam_ua/packs data/speedcam_ua apps/speedcam_ua/cameras.js
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "camera packs $(date -u +%Y-%m-%d)"
          git push
