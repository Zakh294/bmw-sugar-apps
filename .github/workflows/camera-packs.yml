# Monthly: rebuilds the camera packs (Ukraine from the Patrol Police, Europe and the USA from OpenStreetMap),
# commits them to apps/speedcam_ua/packs/, publishes the index as a release asset (its download count ~ cars using
# the app) and writes docs/speedcam_ua/STATS.md. The app in the car downloads the packs that changed, once a month
# (apps/speedcam_ua/updater.js), so no new app version is needed for new cameras.
# Free for a public repository; a few minutes a month of the free allowance for a private one.
name: camera packs

on:
  schedule:
    - cron: '17 3 2-7 * *'        # the 2nd to the 7th of every month, 03:17 UTC: a busy Overpass leaves packs for the next day
  workflow_dispatch: {}
  push:
    branches: ['actions/packs']   # push to this branch to build the packs there (testing the workflow)

permissions:
  contents: write

concurrency:
  group: camera-packs
  cancel-in-progress: false

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ukraine (the police list; kept as it is when the site does not answer)
        continue-on-error: true
        run: python3 -u tools/speedcam_ua/import_cameras.py --fetch && python3 tools/speedcam_ua/gen_app_data.py
      - name: Packs
        run: python3 -u tools/speedcam_ua/build_packs.py --minutes 90 --fresh-days 20
      - name: Tests
        run: python3 test/speedcam_ua/packs_test.py && python3 test/speedcam_ua/stats_test.py
      - name: Commit
        id: commit
        run: |
          git config user.name "camera-packs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/speedcam_ua/packs data/speedcam_ua
          if git diff --cached --quiet; then echo "nothing changed"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "camera packs $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The index as a release asset: cars read it from releases/latest, and GitHub counts its downloads, which is
      # how we know roughly how many cars use the app (tools/speedcam_ua/release_stats.py). A new release when the
      # packs changed, or the first run of a month; main only.
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(date -u +%Y-%m)
          if [ "${{ steps.commit.outputs.changed }}" = "true" ] || ! gh release list --limit 100 --json tagName -q '.[].tagName' | grep -q "^packs-$MONTH"; then
            TAG="packs-$(date -u +%Y-%m-%d)"
            if gh release view "$TAG" >/dev/null 2>&1; then TAG="$TAG-$(date -u +%H%M)"; fi
            gh release create "$TAG" apps/speedcam_ua/packs/index.json --target "$(git rev-parse HEAD)" --latest \
              --title "Camera packs $(date -u +%Y-%m-%d)" \
              --notes "The monthly camera databases of SpeedCam: $(python3 -c "import json;i=json.load(open('apps/speedcam_ua/packs/index.json'));print(len(i['packs']),'packs,',sum(p['count'] or 0 for p in i['packs'].values()),'cameras')"). Cars read index.json from here; its download count is the rough number of cars using the app (docs/speedcam_ua/STATS.md). Data: police of Ukraine; (c) OpenStreetMap contributors, ODbL."
          fi
      - name: Stats
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/speedcam_ua/release_stats.py
          git add docs/speedcam_ua/STATS.md docs/speedcam_ua/stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "stats $(date -u +%Y-%m-%d)"
          git push
